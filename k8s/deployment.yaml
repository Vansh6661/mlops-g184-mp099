apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp099-api
  labels:
    app: mp099-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp099-api
  template:
    metadata:
      labels:
        app: mp099-api
    spec:
      containers:
      - name: mp099-api
        image: mp099-api:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
